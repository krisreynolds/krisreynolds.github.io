<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrisReynolds.co.uk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            line-height: 1.6; color: #333; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            min-height: 100vh; 
        }
        .container { max-width: 900px; margin: 0 auto; padding: 60px 20px; }
        h1 { 
            font-size: clamp(2.5rem, 8vw, 4rem); text-align: center; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            margin-bottom: 20px; font-weight: 300; 
        }
        .intro { 
            text-align: center; max-width: 600px; margin: 0 auto 50px; 
            font-size: 1.2rem; color: #555; 
        }
        .projects { 
            display: grid; gap: 20px; 
        }
        .project { 
            background: rgba(255,255,255,0.9); 
            padding: 30px; border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            transition: all 0.3s ease; 
        }
        .project:hover { 
            transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
        }
        .project h3 { 
            color: #667eea; font-size: 1.5rem; margin-bottom: 10px; 
        }
        .project a { 
            color: #667eea; text-decoration: none; font-weight: 600; 
        }
        .project a:hover { color: #764ba2; }
        @media (max-width: 768px) { .container { padding: 40px 15px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>KrisReynolds.co.uk</h1>
        <p class="intro">Just a list of the things I've worked on or am still working on.</p>
        <div class="projects">
            <div class="project">
                <h3><a href="https://scoutbook.org.uk" target="_blank">Scoutbook</a></h3>
                <p>A directory of various Scouting resources and information.</p>
            </div>
        </div>
    </div>
</body>
</html>
